<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Điều hành Hà Vi – 22.9.26</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--pri:#2952cc;--pri2:#e8eeff;--txt:#1d2433;--mut:#6b7280;--bd:#e3e7ef;--hl:#fff3a3}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:linear-gradient(120deg,#1e3a8a,#2952cc);color:#fff;padding:14px 20px 0;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:19px;font-weight:600}
h1 small{font-weight:400;opacity:.8;font-size:13px;margin-left:6px}
.tools{display:flex;gap:8px;align-items:center}
#q{padding:8px 12px;border-radius:8px;border:none;width:240px;font-size:14px;outline:none}
.btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.btn:hover{background:rgba(255,255,255,.28)}
/* day buttons */
.days{display:flex;gap:8px;margin-top:4px;padding-top:9px;overflow-x:auto;padding-bottom:12px;align-items:stretch}
.days button{flex:1 0 auto;min-width:86px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:8px 10px;cursor:pointer;text-align:center;transition:.15s;position:relative}
.days button b{display:block;font-size:16px}
.days button small{opacity:.8;font-size:11.5px}
.days button:hover{background:rgba(255,255,255,.25)}
.days button.active{background:#fff;color:var(--pri);border-color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.days button .today{position:absolute;top:-7px;right:6px;background:#ffcc00;color:#000;font-size:10px;font-weight:700;border-radius:8px;padding:1px 6px}
.days .sep{width:1px;background:rgba(255,255,255,.3);flex:0 0 1px;margin:0 4px}
.days button.alt{min-width:110px;background:rgba(0,0,0,.15)}
.days button.alt.active{background:#fff}
main{padding:18px 20px 40px;max-width:1500px;margin:0 auto}
/* day view */
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.dayhead h2{margin:0;font-size:24px;color:#1e3a8a}
.stat{background:#fff;border-radius:10px;padding:6px 12px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:13px;color:var(--mut)}
.stat b{color:var(--txt);font-size:15px;margin-right:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow:hidden}
.card.full{grid-column:1/-1}
.card>h3{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.card>h3 .n{margin-left:auto;background:var(--pri2);color:var(--pri);font-size:12px;border-radius:10px;padding:1px 9px}
.card .body{padding:12px 16px}
.card.warn{background:#fffbea;border:1px solid #f5d565}
.card.warn>h3{border-color:#f5d565;color:#8a6100}
.card.warn ul{margin:0;padding-left:20px;line-height:1.8}
.none{color:var(--mut);font-style:italic;padding:4px 0}
.list{width:100%;border-collapse:collapse}
.list td{padding:8px 6px;border-bottom:1px dashed var(--bd);vertical-align:top}
.list tr:last-child td{border-bottom:none}
.list .who{font-weight:600;white-space:nowrap}
.list .who small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.time{display:inline-block;background:#eef2ff;color:#1e3a8a;border-radius:6px;padding:1px 8px;font-weight:600;font-size:12.5px;white-space:nowrap}
.role{display:inline-block;background:#f3e8ff;color:#7e22ce;border-radius:6px;padding:1px 8px;font-size:12.5px;margin:1px 2px}
.sess{display:inline-block;background:#fde68a;color:#78350f;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;margin-right:6px}
.chip{display:inline-block;border-radius:14px;padding:3px 10px;margin:3px 4px 3px 0;font-size:13px;background:#f1f5f9}
.chip.free{background:#dcfce7;color:#15803d;font-weight:600}
.chip.ca2{background:#e0f2fe;color:#0369a1;font-weight:600}
.sub{font-size:12.5px;color:var(--mut);margin:10px 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cls{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;background:#fcfdff}
.cls .cn{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cls .cn b{font-size:16px;color:#1e3a8a}
.cls .b{font-size:11px;background:#1e3a8a;color:#fff;border-radius:6px;padding:1px 7px}
.cls .b.b2{background:#0f766e}
.cls .b.ex{background:#b45309}
.cls ul{margin:0;padding-left:18px;line-height:1.7}
.cls .grp{margin-top:6px;padding:6px 8px;background:#fff7ed;border-radius:8px;font-size:13px}
.cls .nt{margin-top:6px;font-size:12.5px;color:#b91c1c}
.item{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.item:last-child{margin-bottom:0}
.item .t{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.item .t b{font-size:15px}
.lop{display:inline-block;background:#1e3a8a;color:#fff;border-radius:6px;padding:0 7px;font-size:12px;font-weight:600}
.tag{display:inline-block;border-radius:6px;padding:0 7px;font-size:12px;font-weight:600}
.tag.go{background:#dcfce7;color:#166534}.tag.grab{background:#dcfce7;color:#00a651}.tag.warn{background:#fee2e2;color:#b91c1c}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 8px;font-size:13.5px;line-height:1.5}
.kv span:nth-child(odd){color:var(--mut)}
.food{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.wk{background:#fff7ed;border-radius:8px;padding:6px 8px;font-size:13px}
.wk small{display:block;color:#9a3412;font-weight:600;font-size:11px}
.wk.cur{outline:2px solid #f97316;background:#ffedd5}
.shop{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.6}
a.tel{color:#0a7a55;text-decoration:none;white-space:nowrap;font-weight:500}
a.tel:hover{text-decoration:underline}
/* table view */
section{background:var(--card);border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:24px;overflow:hidden}
section h2{margin:0;padding:14px 18px;font-size:16px;border-bottom:1px solid var(--bd);color:var(--pri);display:flex;justify-content:space-between}
section h2 span{color:var(--mut);font-weight:400;font-size:12px}
.wrap{overflow:auto}
table.raw{border-collapse:separate;border-spacing:0;width:100%;min-width:600px}
.raw th,.raw td{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:7px 10px;vertical-align:top;text-align:left;white-space:pre-line;line-height:1.4}
.raw thead th{background:#eef2ff;color:#1e3a8a;font-weight:600;text-align:center}
.raw tbody tr:nth-child(even) td{background:#fafbfe}
.raw td.first{font-weight:600;background:#f7f9ff!important;color:#1e3a8a}
.raw tr.gap td{padding:3px;background:#f4f6fb!important}
.raw td.note{background:#fffbea!important;color:#7a5b00;font-style:italic}
.day{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:6px;padding:1px 8px;font-weight:600;font-size:12.5px}
.free{display:inline-block;background:#dcfce7;color:#15803d;border-radius:6px;padding:1px 8px;font-weight:600}
mark{background:var(--hl);padding:0 1px;border-radius:2px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.subtabs button.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.hidden{display:none!important}
@media print{header{position:static}.days,.tools{display:none}.card{break-inside:avoid;box-shadow:none;border:1px solid #ccc}}
@media(max-width:640px){#q{width:150px}main{padding:12px}.grid{grid-template-columns:1fr}.weeks{grid-template-columns:repeat(2,1fr)}}
</style>

  let fd='';
  (D.food[day]||[]).forEach(f=>{
    const items=[...new Set(f.menu.map(m=>m.mon))];
    const shops=D.suppliers.filter(s=>items.some(i=>matchFood(i,s.ten)));
    fd+=`<div class="food"><div class="t">${sess(f.session)}Lớp <span class="lop">${esc(f.lop)}</span> &nbsp;Giờ lấy: <span class="time">${esc(f.gio||'—')}</span></div>
      <div class="weeks">${f.menu.map((m,i)=>`<div class="wk ${i+1===weekOfMonth?'cur':''}"><small>${esc(m.tuan)}${i+1===weekOfMonth?' (tuần này?)':''}</small>${esc(m.mon)}</div>`).join('')}</div>
      ${shops.length?`<div class="shop">🛒 ${shops.map(s=>`<b>${esc(s.ten)}</b>${s.gia?' – '+esc(s.gia):''}${s.dl?' ('+esc(s.dl)+')':''}${s.phat?' – phát '+esc(s.phat):''}${s.dt?' '+tel(esc(s.dt)):''}`).join('<br>🛒 ')}</div>`:''}</div>`;});
  if(!fd) fd=none('Không phát đồ ăn');

  main.innerHTML=`<div class="dayhead"><h2>${name}</h2>
     <div class="stat"><b>${nCls}</b>buổi lớp</div><div class="stat"><b>${nWork}</b>TG quản lý</div>
     <div class="stat"><b>${nDD}</b>đưa đón</div><div class="stat"><b>${nGS}</b>gia sư</div><div class="stat"><b>${(D.food[day]||[]).length}</b>suất đồ ăn</div></div>
   <div class="grid">
     ${notes.length?card('⚠️','Việc cần chú ý',null,`<ul>${notes.map(n=>`<li>${n}</li>`).join('')}</ul>`,'warn full'):''}
     ${card('📚','Lớp học & trợ giảng chuyên môn',nCls,clsBody,'full')}
     ${card('🧑‍💼','Trợ giảng quản lý (Lịch TG)',nWork,tgBody)}
     ${card('🚗','Đưa đón',nDD,dd)}
     ${card('🎓','Gia sư',nGS,gs)}
     ${card('🍪','Đồ ăn',(D.food[day]||[]).length,fd)}
   </div>`;
}
function matchFood(item,shop){
  const a=item.toLowerCase(), b=shop.toLowerCase();
  return [['thịt xiên'],['khoai'],['bông lan'],['xúc'],['su kem'],['caramen']].some(([k])=>a.includes(k)&&b.includes(k));
}

// ================= INFO VIEW =================
function renderInfo(){
  const ppl=`<table class="list">${D.persons.map(p=>`<tr><td class="who">${esc(p.name)}</td><td>${p.year?'Sinh '+esc(p.year):''}</td><td>${tel(esc(p.phone))}</td></tr>`).join('')}</table>`;
  const unk=D.grab.filter(x=>!x.days.length);
  const grab=unk.length?unk.map(x=>`<div class="item"><div class="t"><b>${esc(x.hs)}</b><span class="lop">${esc(x.lop)}</span><span class="tag grab">🚕 Đặt Grab khi PH gọi</span></div><div class="kv"><span>Địa chỉ</span><span>${t(x.dc)}</span><span>Ghi chú</span><span>Chưa rõ lịch lớp ${esc(x.lop)}</span></div></div>`).join(''):none('—');
  const shops=`<table class="list">${D.suppliers.map(s=>`<tr><td class="who">${esc(s.ten)}</td><td>${esc(s.gia)}</td><td>${esc(s.dl)}</td><td>${s.phat?'Phát '+esc(s.phat):''}</td><td>${tel(esc(s.dt))}</td></tr>`).join('')}</table>`
    +`<div class="sub">Món xịn</div><table class="list">${D.fancy.map(s=>`<tr><td class="who">${esc(s.ten)}</td><td>${tel(esc(s.dt))}</td></tr>`).join('')}</table>`;
  main.innerHTML=`<div class="dayhead"><h2>ℹ️ Thông tin chung</h2></div><div class="grid">
    ${card('📞','Liên hệ hỗ trợ',null,D.general_notes.map(n=>`<p style="margin:0;line-height:1.8">${t(n.replace(/^Ghi chú:\s*/,'')).replace(/\.\s/g,'.<br>')}</p>`).join(''),'warn full')}
    ${card('🧑‍💼','Danh sách trợ giảng quản lý',D.persons.length,ppl)}
    ${card('🚕','Đặt Grab – chưa rõ ngày',unk.length,grab)}
    ${card('🛒','Nơi mua đồ ăn',D.suppliers.length,shops,'full')}
  </div>`;
}

// ================= RAW TABLE VIEW =================
function fmt(s,term){
  let h=esc(s);
  if(term){const re=new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');h=h.replace(re,'<mark>$1</mark>');}
  h=tel(h);
  if(/^(Thứ\s*\d:?|T\d|CN|Sáng\s*CN|chiều CN)$/i.test(s.trim().replace(/\n/g,' '))) h=`<span class="day">${h}</span>`;
  else if(/^Rảnh$/i.test(s.trim())) h=`<span class="free">${h}</span>`;
  return h;
}
function buildTable(sh,term){
  const rows=sh.rows,n=rows[0].length; let html='<table class="raw"><thead>',shown=0;
  for(let r=0;r<sh.hdr;r++){html+='<tr>';const row=rows[r];
    for(let c=0;c<n;c++){let span=1;if(sh.hdr>1&&r===0){while(c+span<n&&!row[c+span]&&rows[1][c+span])span++;}
      html+=`<th colspan="${span}">${fmt(row[c],term)}</th>`;c+=span-1;}html+='</tr>';}
  html+='</thead><tbody>';
  for(let r=sh.hdr;r<rows.length;r++){const row=rows[r],filled=row.filter(x=>x).length;
    if(!filled){if(!term)html+=`<tr class="gap"><td colspan="${n}"></td></tr>`;continue;}
    if(term&&!row.some(x=>x.toLowerCase().includes(term.toLowerCase())))continue; shown++;
    if(filled===1&&row[0]&&row[0].length>40){html+=`<tr><td class="note" colspan="${n}">📝 ${fmt(row[0],term)}</td></tr>`;continue;}
    html+='<tr>'+row.map((x,i)=>`<td class="${i===0?'first':''}">${fmt(x,term)}</td>`).join('')+'</tr>';}
  return {html:html+'</tbody></table>'+(term&&!shown?'<div class="none" style="padding:20px">Không tìm thấy</div>':''),shown};
}
function renderRaw(){
  const term=q.value.trim();
  const tabs=[...TABLES.map(s=>[s.id,s.title]),['__all','Xem tất cả']];
  const list=rawTab==='__all'?TABLES:TABLES.filter(s=>s.id===rawTab);
  main.innerHTML=`<div class="subtabs">${tabs.map(([id,n])=>`<button data-raw="${id}" class="${id===rawTab?'active':''}">${n}${term&&id!=='__all'?` (${buildTable(TABLES.find(s=>s.id===id),term).shown})`:''}</button>`).join('')}</div>`
    +list.map(s=>`<section><h2>${s.title}<span>${s.rows.length-s.hdr} dòng</span></h2><div class="wrap">${buildTable(s,term).html}</div></section>`).join('');
}

function render(){
  renderNav();
  if(view==='raw') renderRaw(); else if(view==='info') renderInfo();
  else { if(!DAYS.some(d=>d[0]===view)) view=todayKey; renderDay(view); }
}
daysEl.addEventListener('click',e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;try{history.replaceState(null,'','#'+view);}catch(_){}render();window.scrollTo(0,0);}});
main.addEventListener('click',e=>{const b=e.target.closest('button[data-raw]');if(b){rawTab=b.dataset.raw;renderRaw();}});
q.addEventListener('input',()=>view==='raw'&&renderRaw());
document.addEventListener('keydown',e=>{if(e.target===q)return;const i=DAYS.findIndex(d=>d[0]===view);if(i<0)return;
  if(e.key==='ArrowRight'&&i<6){view=DAYS[i+1][0];render();} if(e.key==='ArrowLeft'&&i>0){view=DAYS[i-1][0];render();}});
window.addEventListener('hashchange',()=>{view=location.hash.slice(1)||todayKey;render();});
render();
</script>
